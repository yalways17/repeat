<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f5ee">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
  <link rel="manifest" href="./site.webmanifest">
  <!-- ?v=2：图标改了但文件名没变，加版本号才能绕开浏览器对 favicon 的长期缓存 -->
  <title>Repeat · 健身打卡</title>
  <style>
    /* ===== 浅色（默认） ===== */
    :root {
      color-scheme: light;
      --bg: #f2f5ee;
      --surface: #ffffff;
      --surface-2: #e6ece0;
      --text: #161d12;
      --muted: #66705f;
      --line: #d5ddcc;
      --accent: #57981f;
      --accent-strong: #47831a;
      --accent-soft: #e2f2cf;
      --accent-ink: #23400a;
      --danger: #c0392b;
      --shadow: 0 18px 45px rgba(28, 48, 20, .10);
      --overlay: rgba(24, 32, 18, .45);
    }
    /* ===== 深色 ===== */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d0f0f;
      --surface: #151817;
      --surface-2: #1d211f;
      --text: #f2f4ef;
      --muted: #a7aea9;
      --line: #303632;
      --accent: #9de260;
      --accent-strong: #b8ef86;
      --accent-soft: #26371b;
      --accent-ink: #e7ffd1;
      --danger: #ff8c78;
      --shadow: 0 22px 70px rgba(0, 0, 0, .24);
      --overlay: rgba(0, 0, 0, .62);
    }
    * { box-sizing: border-box; }
    html {
      -webkit-tap-highlight-color: transparent;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;   /* 允许平移滚动，禁掉双指缩放 */
    }
    body {
      margin: 0;
      height: 100%;
      min-width: 320px;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    button, textarea, input { font: inherit; }
    button { color: inherit; }
    .hidden { display: none !important; }
    [hidden] { display: none !important; }
    /* 页面本身锁死：顶部（账号栏 / 日期 / 进度）和底部记录条固定不动，
       只有 .scroll-area 内部滚动。手机上也不会再出现整页橡皮筋回弹。 */
    .app {
      width: min(760px, 100%);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 20px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .scroll-area {
      flex: 1 1 auto;
      min-height: 0;                 /* flex 子项默认 min-height:auto，不写这个它不会收缩，也就不会滚 */
      overflow-y: auto;
      overscroll-behavior: contain;  /* 滚到头也不要带动整页 */
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));  /* 给底部记录条让位 */
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .account-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;   /* 左侧提示已移除，按钮继续靠右 */
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .auth-btn {
      flex: 0 0 auto;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 650;
      cursor: pointer;
      transition: border-color .16s ease;
    }
    .auth-btn:hover { border-color: var(--accent); }
    .top-menu {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-button {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      transition: border-color .16s ease;
    }
    .icon-button:hover { border-color: var(--accent); }
    .icon-button svg { width: 19px; height: 19px; }
    .topline {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }
    .day-heading { margin: 0; }
    .day-heading strong {
      display: block;
      font-family: "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.04;
      letter-spacing: -.04em;
    }
    .day-heading span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }
    .progress-number {
      color: var(--accent-strong);
      font-size: 27px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .progress-number.is-rest { color: var(--muted); font-weight: 650; }
    .progress-track {
      height: 5px;
      overflow: hidden;
      background: var(--surface-2);
      margin-bottom: 22px;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width .25s ease;
    }
    .plan { display: grid; gap: 12px; }
    .rest-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .rest-card strong {
      display: block;
      font-family: "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      font-size: 19px;
      letter-spacing: -.02em;
    }
    .rest-card p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .exercise {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .exercise-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .exercise-index {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }
    .exercise-main { min-width: 0; flex: 1; }
    .exercise h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      letter-spacing: -.015em;
    }
    .prescription {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .sets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .set-btn {
      min-width: 50px;
      min-height: 43px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }
    .set-btn[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .set-btn[aria-pressed="true"]::before { content: "✓ "; }
    /* 已提交锁页：勾过的保持原样，没勾的压暗 */
    .set-btn:disabled { cursor: default; }
    .set-btn:disabled:not([aria-pressed="true"]) { opacity: .38; }
    .sequence {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }
    .sequence .set-btn {
      min-width: 0;
      padding: 8px 6px;
      line-height: 1.2;
    }
    .section-title {
      margin: 31px 0 11px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }
    .note {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 15px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .note:focus { border-color: var(--accent); }
    .note::placeholder { color: var(--muted); opacity: .78; }
    .note:disabled { opacity: .45; cursor: not-allowed; }
    .finish-row {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      padding: 12px max(20px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
    }
    .finish-inner {
      width: min(720px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-copy { flex: 1; min-width: 0; }
    .status-copy strong { display: block; font-size: 14px; }
    .finish-btn {
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      padding: 0 22px;
      background: var(--accent);
      color: #102004;
      font-weight: 780;
      cursor: pointer;
    }
    .finish-btn:disabled { opacity: .38; cursor: default; }
    .history-list { display: grid; gap: 9px; }
    .history-empty {
      padding: 17px 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .history-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .history-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-weight: 800;
    }
    .history-item strong { display: block; }
    .history-item small { color: var(--muted); overflow-wrap: anywhere; }
    .history-right { display: flex; align-items: center; gap: 10px; }
    .history-percent { color: var(--accent-strong); font-weight: 750; font-variant-numeric: tabular-nums; }
    /* 休息日：不做成「0% 失败」的样子 */
    .history-item.is-rest .history-mark { background: var(--surface-2); color: var(--muted); }
    .history-item.is-rest .history-percent { color: var(--muted); font-weight: 650; }
    .h-del {
      border: 0;
      background: none;
      padding: 6px 2px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      transition: color .16s ease;
    }
    .h-del:hover { color: var(--danger); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 91px;
      z-index: 60;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      background: var(--text);
      color: var(--bg);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      transition: opacity .2s ease, transform .2s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== 右上角菜单 ===== */
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 110;
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 14px 14px;
      background: rgba(0, 0, 0, .18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .menu-overlay.open { display: flex; }
    .menu-panel {
      min-width: 212px;
      max-width: 260px;
      padding: 16px 16px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      animation: menuIn .3s cubic-bezier(.22, 1, .36, 1);
      transform-origin: top right;
    }
    @keyframes menuIn {
      0% { opacity: 0; transform: scale(.92) translateY(-6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .menu-panel .menu-close {
      float: right;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }
    .menu-panel .menu-close:hover { background: var(--surface-2); color: var(--text); }
    .menu-panel .menu-close svg { width: 16px; height: 16px; }
    .menu-section { margin-bottom: 14px; }
    .menu-section .menu-label {
      margin-bottom: 8px;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .menu-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 10px;
      font-size: .88rem;
      color: var(--text);
      cursor: pointer;
      transition: background .15s ease;
    }
    .menu-option:hover { background: var(--surface-2); }
    .menu-option .menu-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .menu-option .menu-icon svg { width: 19px; height: 19px; }
    .menu-option .radio {
      position: relative;
      flex: 0 0 auto;
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--line);
      border-radius: 50%;
      transition: border-color .15s;
    }
    .menu-option .radio.active { border-color: var(--accent); }
    .menu-option .radio.active::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .menu-about {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    /* ===== 弹窗（账户） ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      background: var(--overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      width: min(380px, 100%);
      max-height: 100%;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 22px;
      box-shadow: var(--shadow);
    }
    .modal-title {
      font-family: "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .modal-sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .auth-form { display: grid; gap: 10px; margin-top: 18px; }
    .auth-form input {
      min-height: 46px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 13px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }
    .auth-form input:focus { border-color: var(--accent); }
    .auth-form input::placeholder { color: var(--muted); opacity: .72; }
    .auth-submit {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #102004;
      font-weight: 780;
      cursor: pointer;
    }
    .auth-submit:disabled { opacity: .45; cursor: default; }
    .auth-submit.ghost {
      background: none;
      border: 1px solid var(--line);
      color: var(--text);
    }
    .auth-switch {
      justify-self: center;
      border: 0;
      padding: 4px 0;
      background: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .auth-switch:hover { color: var(--text); }
    .auth-status {
      min-height: 18px;
      font-size: 12.5px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .auth-status.error { color: var(--danger); }
    .auth-status.success { color: var(--accent-strong); }
    .auth-account {
      display: grid;
      gap: 4px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
    }
    .auth-account-email { font-weight: 700; overflow-wrap: anywhere; }
    .auth-account-sub { color: var(--muted); font-size: 12px; }
    .modal-close { margin-top: 14px; text-align: center; }
    .modal-close button {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .modal-close button:hover { color: var(--text); }

    @media (max-width: 480px) {
      .app { padding-left: 14px; padding-right: 14px; }
      .topline { margin-top: 2px; }
      .exercise { padding: 15px; border-radius: 11px; box-shadow: none; }
      .rest-card { padding: 26px 18px; }
      .exercise h2 { font-size: 16px; }
      .sequence { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
  <script>
    // 首次绘制前先定好主题，避免闪一下再变色
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('fitness_appearance_v1') || 'system'; } catch (e) { /* 忽略 */ }
      var dark = pref === 'dark' ||
        (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0d0f0f' : '#f2f5ee');
    }());

    // 禁止页面缩放
    // meta 里的 user-scalable=no + CSS 的 touch-action 已经能挡住绝大多数浏览器，
    // 但 iOS Safari 从 10 开始【故意忽略】user-scalable=no（出于无障碍考虑），
    // 所以必须再监听它私有的 gesture* 事件，才能真正拦住双指缩放。
    (function () {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
        document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
      });
      // 桌面端：Ctrl + 滚轮 / 触控板双指缩放
      // （浏览器自带的 Ctrl + 加减号拦不住，那是浏览器层面的快捷键）
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });
    }());
  </script>
</head>
<body>
  <main class="app">
    <div class="account-row">
      <div class="top-menu">
        <button class="auth-btn" id="authBtn" type="button">登录</button>
        <button class="icon-button" id="menuBtn" type="button" aria-label="菜单" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6.5" x2="20" y2="6.5"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17.5" x2="20" y2="17.5"/></svg>
        </button>
      </div>
    </div>

    <div class="topline">
      <h1 class="day-heading"><strong id="dayTitle">周一</strong><span id="dayFocus">胸 · 三头</span></h1>
      <div class="progress-number" id="progressNumber">0%</div>
    </div>
    <div class="progress-track" role="progressbar" aria-label="今日训练完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>

    <div class="scroll-area">
      <section class="plan" id="plan" aria-live="polite"></section>

      <h2 class="section-title">训练备注</h2>
      <textarea class="note" id="note" maxlength="500" placeholder="今天的状态、动作感受、需要调整的地方……"></textarea>
    </div>
  </main>

  <div class="finish-row" id="finishRow">
    <div class="finish-inner">
      <div class="status-copy"><strong id="statusStrong">还没开始</strong></div>
      <button class="finish-btn" type="button" id="finishBtn" disabled>记录本次</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      'use strict';

      // ===== 配置 =====
      const CONFIG = {
        STORAGE_KEY: 'fitness_state_v1',
        HISTORY_KEY: 'fitness_history_v1',
        APPEARANCE_KEY: 'fitness_appearance_v1',
        SUPABASE_URL: 'https://gxkbxietjnndoobrfsei.supabase.co',
        SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_HpgYJy047dTpzdF_6VCquQ_XUI_KVs_',
        HISTORY_LIMIT: 500,
        REST_FOCUS: '休息'
      };

      // ===== Supabase =====
      const supabaseClient = (window.supabase && window.supabase.createClient)
        ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
          })
        : null;
      if (!supabaseClient) console.warn('健身打卡: Supabase SDK 未加载，已降级为纯本地模式。');

      let currentUser = null;
      let cloudHydrated = false;
      let cloudSaveTimer = null;
      let authBusy = false;
      let authRegisterMode = false;
      /* 用户自己点「登录/注册」提交的时间戳：handleAuthSession 只认这个，
         用来区分"用户主动登录"和"后台恢复会话/刷新令牌"（见那里的注释） */
      let authUserInitiatedAt = 0;
      let rolloverTimer = null;

      // ===== 训练计划 =====
      // 下标 0–3 依次对应周一–周四；周五/六/日没有计划（休息日）
      const plans = [
        {
          day: '周一', focus: '胸 · 三头', exercises: [
            { name: '哑铃平板卧推', detail: '12.5kg · 8–10次 × 4组', sets: ['组1','组2','组3','组4'] },
            { name: '哑铃上斜推举', detail: '7.5kg · 10–12次 × 3组', sets: ['组1','组2','组3'] },
            { name: '俯卧撑', detail: '15–20次 × 3组', sets: ['组1','组2','组3'] },
            { name: '窄距俯卧撑', detail: '10–12次 × 3组', sets: ['组1','组2','组3'] }
          ]
        },
        {
          day: '周二', focus: '背 · 二头', exercises: [
            { name: '哑铃单臂划船', detail: '12.5kg · 每侧10–12次 × 4组', sets: ['组1','组2','组3','组4'] },
            { name: '俯身飞鸟', detail: '5kg · 15次 × 3组', sets: ['组1','组2','组3'] },
            { name: '哑铃弯举', detail: '按顺序完成', sequence: true, sets: ['5×15','7.5×10','12.5×3–4','7.5×8–11','12.5×3','7.5力竭'] },
            { name: '锤式弯举', detail: '5kg · 12–15次 × 3组', sets: ['组1','组2','组3'] }
          ]
        },
        {
          day: '周三', focus: '功能性循环', exercises: [
            { name: '哑铃下落蹲', detail: '5次', sets: ['完成'] },
            { name: '哑铃纵跳', detail: '5次', sets: ['完成'] },
            { name: '哑铃分腿下落蹲', detail: '每边5次', sets: ['完成'] },
            { name: '哑铃分腿抓举', detail: '每边5次', sets: ['完成'] },
            { name: '哑铃高脚杯深蹲', detail: '8次', sets: ['完成'] },
            { name: '哑铃分腿蹲对角线上举', detail: '每边8次', sets: ['完成'] },
            { name: '哑铃高脚杯侧弓步', detail: '每边6次', sets: ['完成'] },
            { name: '哑铃高抬腿', detail: '每边8次', sets: ['完成'] },
            { name: '哑铃转体上台阶', detail: '每边8次', sets: ['完成'] },
            { name: '俯身哑铃划船转体上举', detail: '每边8次', sets: ['完成'] }
          ]
        },
        {
          day: '周四', focus: '肩 · 手臂', exercises: [
            { name: '侧平举', detail: '5kg · 12–15次 × 3组', sets: ['组1','组2','组3'] },
            { name: '前平举', detail: '5kg · 12次 × 3组', sets: ['组1','组2','组3'] },
            { name: '哑铃弯举', detail: '7.5kg · 10–12次 × 3组', sets: ['组1','组2','组3'] }
          ]
        }
      ];

      const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

      // ===== 状态 =====
      // activeDay 为 null 表示当前处于「休息日」视图
      const state = {
        activeDay: null,
        activeDate: '',
        startDate: '',          // 第一次打开这个 App 的日期，用来决定历史补到哪一天
        days: plans.map(function (plan) {
          return {
            checks: plan.exercises.map(function (exercise) {
              return exercise.sets.map(function () { return false; });
            }),
            note: ''
          };
        }),
        version: 2
      };

      // ===== DOM 引用 =====
      const $ = function (id) { return document.getElementById(id); };
      const dom = {
        authBtn: $('authBtn'),
        menuBtn: $('menuBtn'),
        menuOverlay: $('menuOverlay'),
        menuClose: $('menuClose'),
        historyMenuBtn: $('historyMenuBtn'),
        historyModal: $('historyModal'),
        historyCloseBtn: $('historyCloseBtn'),
        dayTitle: $('dayTitle'),
        dayFocus: $('dayFocus'),
        plan: $('plan'),
        note: $('note'),
        historyList: $('historyList'),
        progressNumber: $('progressNumber'),
        progressFill: $('progressFill'),
        progressTrack: document.querySelector('.progress-track'),
        finishRow: $('finishRow'),
        finishBtn: $('finishBtn'),
        statusStrong: $('statusStrong'),
        toast: $('toast'),
        authModal: $('authModal'),
        authTitle: $('authTitle'),
        authSub: $('authSub'),
        authForm: $('authForm'),
        authEmail: $('authEmail'),
        authPassword: $('authPassword'),
        authSubmitBtn: $('authSubmitBtn'),
        authSwitchBtn: $('authSwitchBtn'),
        authStatus: $('authStatus'),
        authAccountView: $('authAccountView'),
        authAccountEmail: $('authAccountEmail'),
        authSignOutBtn: $('authSignOutBtn'),
        authCloseBtn: $('authCloseBtn'),
        authGuestCloseWrap: $('authGuestCloseWrap'),
        authGuestCloseBtn: $('authGuestCloseBtn')
      };

      let toastTimer = null;

      // ===== 外观（浅色 / 深色，默认跟随系统） =====
      const appearanceOptions = document.querySelectorAll('.appearance-option');
      let appearancePref = 'system';

      function resolveTheme(pref) {
        if (pref === 'light' || pref === 'dark') return pref;
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }

      function applyAppearance(pref) {
        appearancePref = (pref === 'light' || pref === 'dark') ? pref : 'system';
        const theme = resolveTheme(appearancePref);
        document.documentElement.setAttribute('data-theme', theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d0f0f' : '#f2f5ee');
        try { localStorage.setItem(CONFIG.APPEARANCE_KEY, appearancePref); } catch (e) { /* 忽略 */ }
        // 圆点跟着「当前实际生效的主题」走，而不是原始偏好值。
        // 否则从没选过时 appearancePref 是 'system'，而菜单里只有浅色/深色两项，
        // 两个圆点就都不亮 —— 看起来像没选中任何东西。
        appearanceOptions.forEach(function (el) {
          const radio = el.querySelector('.radio');
          if (radio) radio.classList.toggle('active', el.dataset.appearance === theme);
        });
      }

      function loadAppearance() {
        let pref = 'system';
        try { pref = localStorage.getItem(CONFIG.APPEARANCE_KEY) || 'system'; } catch (e) { /* 忽略 */ }
        if (pref !== 'dark' && pref !== 'light' && pref !== 'system') pref = 'system';
        applyAppearance(pref);
      }

      // 选「跟随系统」时，系统切换深浅色要立刻跟上
      if (window.matchMedia) {
        const schemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const onSchemeChange = function () {
          if (appearancePref === 'system') applyAppearance('system');
        };
        if (schemeQuery.addEventListener) schemeQuery.addEventListener('change', onSchemeChange);
        else if (schemeQuery.addListener) schemeQuery.addListener(onSchemeChange);
      }

      function esc(text) {
        return String(text).replace(/[&<>'"]/g, function (char) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char];
        });
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        dom.toast.textContent = message;
        dom.toast.classList.add('show');
        toastTimer = setTimeout(function () { dom.toast.classList.remove('show'); }, 2200);
      }

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      // ===== 今天是周几 =====
      function todayKey() {
        return dayKeyOf(new Date());
      }

      // 返回今天对应的 plans 下标；周五/六/日（或没有对应计划）返回 null
      function todayPlanIndex() {
        return planIndexForDow(new Date().getDay()); // 0=周日, 1=周一 … 6=周六
      }

      // 星期值 -> plans 下标（按 day 字段名解析，避免写死顺序）
      function planIndexForDow(dow) {
        for (let i = 0; i < plans.length; i++) {
          if (planDow(i) === dow) return i;
        }
        return null;
      }

      // plans 下标 -> getDay() 的星期值
      function planDow(index) {
        const name = plans[index] && plans[index].day;
        const pos = WEEKDAYS.indexOf(name);
        return pos < 0 ? -1 : pos;
      }

      // ---- 日期工具：统一用 'YYYY-MM-DD' 字符串，字典序就是时间序 ----
      function dayKeyOf(dateObj) {
        return dateObj.getFullYear() + '-' +
          String(dateObj.getMonth() + 1).padStart(2, '0') + '-' +
          String(dateObj.getDate()).padStart(2, '0');
      }

      function shiftKey(key, days) {
        const p = key.split('-');
        const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        d.setDate(d.getDate() + days);
        return dayKeyOf(d);
      }

      // 'YYYY-MM-DD' -> '09-27'
      function shortKey(key) {
        return key ? key.slice(5) : '—';
      }

      function resetDay(dayIndex) {
        const plan = plans[dayIndex];
        state.days[dayIndex].checks = plan.exercises.map(function (exercise) {
          return exercise.sets.map(function () { return false; });
        });
        state.days[dayIndex].note = '';
      }

      // 只能看当天：activeDay 恒等于今天对应的训练日（周五/六/日为 null）
      // 跨天时先把当天的勾选清零，否则会看到上周同一天遗留的旧记录
      function syncActiveDayWithToday() {
        const today = todayKey();
        const todayIndex = todayPlanIndex();
        let changed = false;

        if (state.activeDate !== today) {
          state.activeDate = today;
          if (todayIndex !== null) resetDay(todayIndex);
          changed = true;
        }
        if (state.activeDay !== todayIndex) {
          state.activeDay = todayIndex;
          changed = true;
        }
        return changed;
      }

      // ===== 状态序列化（本机 <-> 云端共用同一份结构） =====
      function getSerializableState() {
        return {
          activeDay: state.activeDay,
          activeDate: state.activeDate,
          startDate: state.startDate,
          days: state.days.map(function (day) {
            return {
              checks: day.checks.map(function (row) { return row.slice(); }),
              note: day.note
            };
          }),
          version: 2
        };
      }

      function applyState(d) {
        if (!d || typeof d !== 'object') return false;
        if (Array.isArray(d.days)) {
          plans.forEach(function (plan, dayIndex) {
            const srcDay = d.days[dayIndex];
            if (!srcDay) return;
            plan.exercises.forEach(function (exercise, exerciseIndex) {
              const srcRow = srcDay.checks && srcDay.checks[exerciseIndex];
              exercise.sets.forEach(function (_label, setIndex) {
                state.days[dayIndex].checks[exerciseIndex][setIndex] = !!(srcRow && srcRow[setIndex]);
              });
            });
            state.days[dayIndex].note = typeof srcDay.note === 'string' ? srcDay.note.slice(0, 500) : '';
          });
        }
        if (typeof d.activeDate === 'string') state.activeDate = d.activeDate;
        if (typeof d.startDate === 'string') state.startDate = d.startDate;
        if (d.activeDay === null) {
          state.activeDay = null;
        } else if (typeof d.activeDay === 'number' && d.activeDay >= 0 && d.activeDay < plans.length) {
          state.activeDay = d.activeDay;
        }
        return true;
      }

      function saveState() {
        const d = getSerializableState();
        try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(d)); } catch (e) { /* 忽略配额异常 */ }
        if (currentUser && cloudHydrated) {
          clearTimeout(cloudSaveTimer);
          cloudSaveTimer = setTimeout(function () { saveCloudState(getSerializableState()); }, 900);
        }
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
          if (!raw) return false;
          return applyState(JSON.parse(raw));
        } catch (e) { return false; }
      }

      async function saveCloudState(d) {
        if (!supabaseClient || !currentUser || !cloudHydrated) return;
        const { error } = await supabaseClient.from('fitness_state').upsert({
          user_id: currentUser.id,
          state: d,
          updated_at: new Date().toISOString()
        }, { onConflict: 'user_id' });
        if (error) console.warn('健身打卡 状态同步:', error.message);
      }

      async function hydrateFromCloud() {
        if (!supabaseClient || !currentUser) { cloudHydrated = true; return; }
        const { data, error } = await supabaseClient
          .from('fitness_state').select('state').eq('user_id', currentUser.id).maybeSingle();
        if (error) {
          console.warn('健身打卡 云端状态:', error.message);
          cloudHydrated = true;
          return;
        }
        if (data && data.state) {
          applyState(data.state);
          try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data.state)); } catch (e) { /* 忽略 */ }
        } else {
          // 第一次登录：把本机已有进度迁移到云端
          const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
          if (raw) {
            try { await saveCloudState(JSON.parse(raw)); } catch (e) { /* 忽略 */ }
          }
        }
        cloudHydrated = true;
        if (syncActiveDayWithToday()) saveState();
        renderPlan();
        await loadCloudHistory();
        if (await closeOutPastDays()) renderPlan();
      }

      // ===== 历史记录（本机缓存 + 云端） =====
      function getHistory() {
        try {
          const raw = localStorage.getItem(CONFIG.HISTORY_KEY);
          if (!raw) return [];
          const data = JSON.parse(raw);
          return Array.isArray(data) ? data : [];
        } catch (e) { return []; }
      }

      function setHistory(history) {
        try { localStorage.setItem(CONFIG.HISTORY_KEY, JSON.stringify(history)); } catch (e) { /* 忽略 */ }
      }

      // 按日期升序存放（字典序 == 时间序）
      function sortHistory(list) {
        list.sort(function (a, b) {
          const x = a.date || '', y = b.date || '';
          return x < y ? -1 : (x > y ? 1 : 0);
        });
        return list;
      }

      function getRecordByDate(date) {
        const hit = getHistory().filter(function (r) { return r.date === date; });
        return hit.length ? hit[0] : null;
      }

      // 今天是否已经提交过 —— 提交过就锁页
      function isTodayLocked() {
        return !!getRecordByDate(todayKey());
      }

      // 某一天「本来该是什么」：有训练日就是那天的计划，没有就是休息
      function buildDayRecord(date, percent, note) {
        const dow = new Date(date + 'T12:00:00').getDay();
        const idx = planIndexForDow(dow);
        const isRest = idx === null;
        return {
          id: makeId(),
          date: date,
          day: WEEKDAYS[dow],
          focus: isRest ? CONFIG.REST_FOCUS : plans[idx].focus,
          percent: isRest ? 0 : (percent || 0),
          note: note || '',
          rest: isRest,
          trainedAt: new Date(date + 'T00:00:00').toISOString()
        };
      }

      // 云端 + 本机取并集：同一天以云端为准，本机独有的保留下来
      // （离线提交、上次上传失败留下的记录，不能因为一次拉取就被抹掉）
      function mergeHistories(cloud, local) {
        const byDate = {};
        cloud.forEach(function (r) { if (r.date) byDate[r.date] = r; });
        const localOnly = [];
        local.forEach(function (r) {
          if (r.date && !byDate[r.date]) { byDate[r.date] = r; localOnly.push(r); }
        });
        return {
          merged: sortHistory(Object.keys(byDate).map(function (k) { return byDate[k]; })),
          localOnly: localOnly
        };
      }

      async function loadCloudHistory() {
        if (!supabaseClient || !currentUser) return;
        // 用 select('*') 而不是列名清单：万一 log_date 还没加上，整个查询也不会挂
        const { data, error } = await supabaseClient
          .from('fitness_history')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('trained_at', { ascending: true })
          .limit(CONFIG.HISTORY_LIMIT);
        if (error) { console.warn('健身打卡 云端历史:', error.message); return; }
        const cloud = (data || []).map(function (item) {
          const focus = item.focus || '';
          return {
            id: item.id,
            date: item.log_date || (item.trained_at ? String(item.trained_at).slice(0, 10) : ''),
            day: item.day || '',
            focus: focus,
            percent: item.percent || 0,
            note: item.note || '',
            rest: focus === CONFIG.REST_FOCUS,
            trainedAt: item.trained_at
          };
        });

        const res = mergeHistories(cloud, getHistory());
        setHistory(res.merged);
        renderHistory();
        // 本机独有（云端还没有）的补传上去，两台设备最终才会一致
        if (res.localOnly.length) await cloudWriteRecords(res.localOnly);
      }

      async function cloudWriteRecords(records) {
        if (!supabaseClient || !currentUser || !records.length) return;
        const rows = records.map(function (item) {
          return {
            id: item.id,
            user_id: currentUser.id,
            log_date: item.date,
            day: item.day,
            focus: item.focus,
            percent: item.percent,
            note: item.note || null,
            trained_at: item.trainedAt
          };
        });
        // 有 (user_id, log_date) 唯一索引就走 upsert；没加索引的话退回 insert
        let res = await supabaseClient.from('fitness_history').upsert(rows, { onConflict: 'user_id,log_date' });
        if (res.error) {
          res = await supabaseClient.from('fitness_history').insert(rows);
          if (res.error) console.warn('健身打卡 历史同步:', res.error.message);
        }
      }

      // 唯一的写入口：落本机 + 同步云端。每天最多一条，已存在的日期直接跳过
      async function pushRecords(records) {
        if (!records.length) return 0;
        const history = getHistory();
        const seen = {};
        history.forEach(function (r) { if (r.date) seen[r.date] = true; });

        const added = records.filter(function (rec) {
          if (seen[rec.date]) return false;
          seen[rec.date] = true;
          return true;
        });
        if (!added.length) return 0;

        added.forEach(function (rec) { history.push(rec); });
        sortHistory(history);
        if (history.length > CONFIG.HISTORY_LIMIT) history.splice(0, history.length - CONFIG.HISTORY_LIMIT);
        setHistory(history);
        renderHistory();
        await cloudWriteRecords(added);
        return added.length;
      }

      // 每天 0 点结账：把「今天之前」缺记录的日子补上
      // 休息日标成「休息」，其余一律 0%
      async function closeOutPastDays() {
        const today = todayKey();
        const have = {};
        getHistory().forEach(function (r) { if (r.date) have[r.date] = true; });

        let cursor = (state.startDate && state.startDate < today) ? state.startDate : today;
        const missing = [];
        let guard = 0;
        while (cursor < today && guard++ < 400) {
          if (!have[cursor]) missing.push(buildDayRecord(cursor, 0, ''));
          cursor = shiftKey(cursor, 1);
        }
        if (!missing.length) return 0;
        return await pushRecords(missing);
      }

      async function deleteHistoryItem(id) {
        try {
          setHistory(getHistory().filter(function (item) { return item.id !== id; }));
          renderHistory();
          if (supabaseClient && currentUser) {
            const { error } = await supabaseClient
              .from('fitness_history').delete().eq('id', id).eq('user_id', currentUser.id);
            if (error) console.warn('健身打卡 删除历史:', error.message);
          }
        } catch (e) { /* 忽略 */ }
      }

      function renderHistory() {
        const history = sortHistory(getHistory().slice()).reverse();   // 新的在上面
        if (!history.length) {
          dom.historyList.innerHTML = '<div class="history-empty">暂无记录。</div>';
          return;
        }
        dom.historyList.innerHTML = history.map(function (item) {
          const isRest = !!item.rest || item.focus === CONFIG.REST_FOCUS;
          const meta = [shortKey(item.date), item.note].filter(Boolean).join(' · ');
          return '<div class="history-item' + (isRest ? ' is-rest' : '') + '" data-id="' + esc(item.id) + '">' +
              '<span class="history-mark">' + (isRest ? '·' : '✓') + '</span>' +
              '<div><strong>' + esc((item.day || '') + ' · ' + (item.focus || '')) + '</strong>' +
              '<small>' + esc(meta) + '</small></div>' +
              '<div class="history-right">' +
                '<span class="history-percent">' + (isRest ? '休息' : Number(item.percent || 0) + '%') + '</span>' +
                '<button class="h-del" data-id="' + esc(item.id) + '" type="button" aria-label="删除这条记录">✕</button>' +
              '</div>' +
            '</div>';
        }).join('');
        dom.historyList.querySelectorAll('.h-del').forEach(function (btn) {
          btn.addEventListener('click', function () { deleteHistoryItem(this.dataset.id); });
        });
      }

      // ===== 渲染 =====
      function renderRestView() {
        const dowName = WEEKDAYS[new Date().getDay()];
        dom.dayTitle.textContent = dowName;
        dom.dayFocus.textContent = '休息日';
        dom.note.value = '';
        dom.note.disabled = true;
        dom.finishRow.hidden = true;
        dom.plan.innerHTML = '<div class="rest-card"><strong>今天没有训练安排</strong>' +
          '<p>周五 / 周六 / 周日 休息，好好恢复。</p></div>';
        updateProgress();
      }

      function renderPlan() {
        if (state.activeDay === null) { renderRestView(); return; }

        const plan = plans[state.activeDay];
        const locked = isTodayLocked();
        dom.finishRow.hidden = false;
        dom.dayTitle.textContent = plan.day;
        dom.dayFocus.textContent = plan.focus;
        dom.note.disabled = locked;
        dom.note.value = state.days[state.activeDay].note;
        dom.plan.innerHTML = plan.exercises.map(function (exercise, exerciseIndex) {
          const buttons = exercise.sets.map(function (label, setIndex) {
            const checked = state.days[state.activeDay].checks[exerciseIndex][setIndex];
            return '<button type="button" class="set-btn" data-exercise="' + exerciseIndex + '" data-set="' + setIndex + '"' +
              (locked ? ' disabled' : '') +
              ' aria-pressed="' + checked + '" aria-label="' + esc(exercise.name + ' ' + label) + '">' + esc(label) + '</button>';
          }).join('');
          return '<article class="exercise"><div class="exercise-head"><span class="exercise-index">' + (exerciseIndex + 1) + '</span><div class="exercise-main"><h2>' + esc(exercise.name) + '</h2><p class="prescription">' + esc(exercise.detail) + '</p></div></div><div class="' + (exercise.sequence ? 'sequence' : 'sets') + '">' + buttons + '</div></article>';
        }).join('');
        updateProgress();
      }

      function countDay(dayIndex) {
        const flat = [].concat.apply([], state.days[dayIndex].checks);
        const done = flat.filter(Boolean).length;
        return { done: done, total: flat.length, percent: flat.length ? Math.round(done / flat.length * 100) : 0 };
      }

      function updateProgress() {
        if (state.activeDay === null) {
          dom.progressNumber.textContent = '—';
          dom.progressNumber.classList.add('is-rest');
          dom.progressFill.style.width = '0%';
          dom.progressTrack.setAttribute('aria-valuenow', '0');
          return;
        }

        // 今天提交过就锁住交互（状态行仍显示当天的真实进度，只有按钮文案会变）
        const locked = isTodayLocked();

        const count = countDay(state.activeDay);
        dom.progressNumber.classList.remove('is-rest');
        dom.progressNumber.textContent = count.percent + '%';
        dom.progressFill.style.width = count.percent + '%';
        dom.progressTrack.setAttribute('aria-valuenow', String(count.percent));
        dom.finishBtn.disabled = locked || count.done === 0;
        if (count.done === 0) {
          dom.finishBtn.textContent = '记录本次';
          dom.statusStrong.textContent = '还没开始';
        } else if (count.done === count.total) {
          dom.finishBtn.textContent = '完成训练';
          dom.statusStrong.textContent = '今日计划全部完成';
        } else {
          dom.finishBtn.textContent = '提前结束';
          dom.statusStrong.textContent = '已完成 ' + count.done + ' / ' + count.total;
        }
        // 提交之后：按钮显示「今日已记录」，状态行保持原样
        if (locked) dom.finishBtn.textContent = '今日已记录';
      }

      // ===== 认证 =====
      function updateAuthUI() {
        if (currentUser) {
          dom.authBtn.textContent = (currentUser.email || '账户').split('@')[0];
        } else {
          dom.authBtn.textContent = '登录';
        }
      }

      function setAuthStatus(text, type) {
        dom.authStatus.textContent = text || '';
        dom.authStatus.className = 'auth-status' + (type ? ' ' + type : '');
      }

      function openAuthModal() {
        dom.authModal.classList.add('open');
        if (currentUser) {
          dom.authTitle.textContent = '账户';
          dom.authSub.textContent = '当前账户的数据会自动同步到云端。';
          dom.authForm.classList.add('hidden');
          dom.authAccountView.classList.remove('hidden');
          dom.authAccountEmail.textContent = currentUser.email || '';
          dom.authGuestCloseWrap.classList.add('hidden');
        } else {
          dom.authTitle.textContent = authRegisterMode ? '注册 Repeat' : '登录 Repeat';
          dom.authSub.textContent = '登录后，训练进度与历史记录会在设备间同步。';
          dom.authForm.classList.remove('hidden');
          dom.authAccountView.classList.add('hidden');
          dom.authGuestCloseWrap.classList.remove('hidden');
          dom.authSubmitBtn.textContent = authRegisterMode ? '注册' : '登录';
          dom.authSwitchBtn.textContent = authRegisterMode ? '已有账户？登录' : '还没有账户？注册';
        }
        setAuthStatus('');
      }

      function closeAuthModal() {
        dom.authModal.classList.remove('open');
      }

      function openMenu() {
        dom.menuOverlay.classList.add('open');
      }

      function closeMenu() {
        dom.menuOverlay.classList.remove('open');
      }

      function closeHistoryModal() {
        dom.historyModal.classList.remove('open');
      }

      function friendlyAuthError(error) {
        const raw = (error && error.message) || '操作失败，请稍后重试。';
        const map = {
          'Invalid login credentials': '邮箱或密码不正确。',
          'Email not confirmed': '邮箱还没验证，请先到邮箱点确认链接。',
          'User already registered': '这个邮箱已经注册过了，直接登录即可。',
          'Password should be at least 6 characters': '密码至少需要 6 位。',
          'Unable to validate email address: invalid format': '邮箱格式不正确。',
          'Email rate limit exceeded': '请求太频繁，请稍后再试。',
          'signup is disabled': '该项目的注册功能已关闭。'
        };
        if (map[raw]) return map[raw];
        if (/rate limit|too many/i.test(raw)) return '请求太频繁，请稍后再试。';
        if (/fetch|network|Failed to fetch/i.test(raw)) return '网络连接失败，请检查网络后重试。';
        return raw;
      }

      async function submitAuth() {
        if (authBusy || !supabaseClient) return;
        const email = dom.authEmail.value.trim();
        const password = dom.authPassword.value;
        if (!email || !email.includes('@')) { setAuthStatus('请输入有效邮箱。', 'error'); return; }
        if (password.length < 6) { setAuthStatus('密码至少需要 6 位。', 'error'); return; }

        authBusy = true;
        dom.authSubmitBtn.disabled = true;
        setAuthStatus(authRegisterMode ? '正在注册……' : '正在登录……');
        // 标记"这次是用户主动登录"，成功后 handleAuthSession 才允许自动收起弹窗
        authUserInitiatedAt = Date.now();
        try {
          if (authRegisterMode) {
            const { data, error } = await supabaseClient.auth.signUp({
              email: email,
              password: password,
              options: { emailRedirectTo: window.location.origin + window.location.pathname }
            });
            if (error) throw error;
            if (data.session) {
              setAuthStatus('注册成功，正在同步。', 'success');
            } else {
              setAuthStatus('注册成功，请检查邮箱完成验证后再登录。', 'success');
              authRegisterMode = false;
            }
          } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
            if (error) throw error;
            setAuthStatus('登录成功。', 'success');
          }
        } catch (e) {
          setAuthStatus(friendlyAuthError(e), 'error');
        } finally {
          authBusy = false;
          dom.authSubmitBtn.disabled = false;
        }
      }

      async function handleAuthSession(session) {
        const nextUserId = session && session.user ? session.user.id : null;
        if (nextUserId && currentUser && currentUser.id === nextUserId && cloudHydrated) return;
        currentUser = (session && session.user) || null;
        cloudHydrated = false;
        updateAuthUI();
        if (currentUser) {
          await hydrateFromCloud();
          /* 这里**不能**无条件关掉登录框：
             除了"用户刚提交登录/注册"，后台恢复会话（INITIAL_SESSION）和
             刷新令牌（TOKEN_REFRESHED）也会走到这里，而 hydrateFromCloud()
             是一次云端网络请求 —— 用户正好在这个窗口里点了「登录」，
             弹窗刚打开就会被这句关掉，表现就是"第一次点开自己跳掉、再点才留住"。
             所以只在"这次会话是用户自己主动登录触发的"（15 秒内）才自动收起。 */
          const userJustSignedIn = authUserInitiatedAt && (Date.now() - authUserInitiatedAt < 15000);
          authUserInitiatedAt = 0;
          if (userJustSignedIn) {
            closeAuthModal();
            dom.authEmail.value = '';
            dom.authPassword.value = '';
          }
        }
      }

      // ===== 事件绑定 =====
      function bindEvents() {
        dom.authBtn.addEventListener('click', openAuthModal);
        dom.authSubmitBtn.addEventListener('click', submitAuth);
        dom.authSwitchBtn.addEventListener('click', function () {
          authRegisterMode = !authRegisterMode;
          openAuthModal();
          dom.authPassword.value = '';
        });
        dom.authGuestCloseBtn.addEventListener('click', closeAuthModal);
        dom.authCloseBtn.addEventListener('click', closeAuthModal);
        dom.authModal.addEventListener('click', function (e) {
          if (e.target === this) closeAuthModal();
        });
        dom.authPassword.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); submitAuth(); }
        });
        dom.authEmail.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); submitAuth(); }
        });
        dom.authSignOutBtn.addEventListener('click', async function () {
          if (!supabaseClient) return;
          await supabaseClient.auth.signOut();
          closeAuthModal();
          cloudHydrated = false;
          currentUser = null;
          updateAuthUI();
          setAuthStatus('');
          showToast('已退出登录，数据保留在本机');
        });

        // ---- 右上角菜单 ----
        dom.menuBtn.addEventListener('click', openMenu);
        dom.menuClose.addEventListener('click', closeMenu);
        dom.menuOverlay.addEventListener('click', function (e) {
          if (e.target === this) closeMenu();
        });
        appearanceOptions.forEach(function (el) {
          el.addEventListener('click', function () {
            applyAppearance(this.dataset.appearance);
          });
        });
        dom.historyMenuBtn.addEventListener('click', function () {
          closeMenu();
          renderHistory();
          dom.historyModal.classList.add('open');
        });
        dom.historyCloseBtn.addEventListener('click', closeHistoryModal);
        dom.historyModal.addEventListener('click', function (e) {
          if (e.target === this) closeHistoryModal();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          closeMenu();
          closeAuthModal();
          closeHistoryModal();
        });

        dom.plan.addEventListener('click', function (event) {
          if (state.activeDay === null) return;
          if (isTodayLocked()) return;                 // 锁页后不能再改勾选
          const button = event.target.closest('.set-btn');
          if (!button) return;
          const exerciseIndex = Number(button.getAttribute('data-exercise'));
          const setIndex = Number(button.getAttribute('data-set'));
          const value = !state.days[state.activeDay].checks[exerciseIndex][setIndex];
          state.days[state.activeDay].checks[exerciseIndex][setIndex] = value;
          button.setAttribute('aria-pressed', String(value));
          saveState();
          updateProgress();
        });

        dom.note.addEventListener('input', function () {
          if (state.activeDay === null) return;
          if (isTodayLocked()) return;
          state.days[state.activeDay].note = dom.note.value;
          saveState();
        });

        dom.finishBtn.addEventListener('click', async function () {
          if (state.activeDay === null) return;
          if (isTodayLocked()) return;                 // 每天只能提交一次
          state.days[state.activeDay].note = dom.note.value.trim();
          saveState();
          const count = countDay(state.activeDay);
          if (!count.done) return;

          dom.finishBtn.disabled = true;
          dom.finishBtn.textContent = '保存中…';
          const added = await pushRecords([
            buildDayRecord(todayKey(), count.percent, state.days[state.activeDay].note)
          ]);
          renderPlan();
          showToast(added
            ? (currentUser ? '已记录并同步到云端' : '已记录到本机')
            : '今天已经记录过了');
        });
      }

      // ===== 初始化 =====
      function init() {
        loadAppearance();
        loadState();
        if (!state.startDate) { state.startDate = todayKey(); saveState(); }   // 首次打开，记下起点
        if (syncActiveDayWithToday()) saveState();
        renderPlan();
        renderHistory();
        updateAuthUI();

        // 补上以前漏掉的日子（异步，不挡渲染）
        closeOutPastDays().then(function (n) { if (n) renderPlan(); });

        // 跨天（例如页面在手机上开了一夜）：每分钟检查一次
        // 进入新的一天会清零当天勾选、切到当天计划，并把昨天结账
        clearInterval(rolloverTimer);
        rolloverTimer = setInterval(async function () {
          if (syncActiveDayWithToday()) {
            saveState();
            renderPlan();
          }
          if (await closeOutPastDays()) renderPlan();
        }, 60000);
      }

      document.addEventListener('DOMContentLoaded', function () {
        init();
        bindEvents();

        if (!supabaseClient) {
          console.log('健身打卡 已启动（本地模式）');
          return;
        }

        supabaseClient.auth.onAuthStateChange(function (event, session) {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') {
            setTimeout(function () { handleAuthSession(session); }, 0);
          } else if (event === 'SIGNED_OUT') {
            authUserInitiatedAt = 0;
            currentUser = null;
            cloudHydrated = false;
            updateAuthUI();
          }
        });

        supabaseClient.auth.getSession().then(function (res) {
          const session = res && res.data ? res.data.session : null;
          if (session) handleAuthSession(session);
        }).catch(function (e) {
          console.warn('健身打卡 会话读取:', e && e.message);
        });

        console.log('健身打卡 已启动，今天是 ' + WEEKDAYS[new Date().getDay()]);
      });

      window.__FITNESS = {
        state,
        CONFIG,
        plans,
        todayKey,
        todayPlanIndex,
        syncActiveDayWithToday,
        resetDay,
        applyAppearance,
        loadAppearance,
        getSerializableState,
        applyState,
        saveState,
        getHistory,
        renderHistory,
        renderPlan,
        updateProgress,
        pushRecords,
        mergeHistories,
        closeOutPastDays,
        isTodayLocked,
        getRecordByDate,
        buildDayRecord,
        deleteHistoryItem,
        loadCloudHistory,
        hydrateFromCloud,
        countDay
      };
    }());
  </script>
</body>
</html>
